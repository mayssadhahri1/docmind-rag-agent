services:
  # LLM local
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # Télécharge les modèles au premier démarrage
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2 && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: llama3.2
      EMBED_MODEL: nomic-embed-text
    volumes:
      - index:/app/data
    ports:
      - "8000:8000"

volumes:
  ollama:
  index:
