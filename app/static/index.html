<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMind — assistant documentaire</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262a36; --text:#e7e9ee; --muted:#8b91a1; --accent:#7c9cff; --ok:#3ecf8e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:grid; grid-template-columns:300px 1fr; }
  aside { border-right:1px solid var(--line); padding:24px; display:flex; flex-direction:column; gap:18px; background:var(--panel); }
  h1 { font-size:20px; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; }
  .drop { border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; transition:.2s; }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--text); }
  ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  li { display:flex; justify-content:space-between; align-items:center; background:#1e2230; padding:8px 10px; border-radius:8px; }
  li button { background:none; border:none; color:var(--muted); cursor:pointer; }
  .status { margin-top:auto; font-size:12px; color:var(--muted); } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#e5484d; } .dot.up { background:var(--ok); }
  main { display:flex; flex-direction:column; height:100vh; }
  #chat { flex:1; overflow-y:auto; padding:32px max(24px, calc((100% - 760px)/2)); display:flex; flex-direction:column; gap:18px; }
  .msg { max-width:100%; line-height:1.6; font-size:15px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#0b0d14; padding:10px 14px; border-radius:14px 14px 4px 14px; max-width:80%; }
  .bot { background:var(--panel); border:1px solid var(--line); padding:14px 16px; border-radius:14px; }
  .chips { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; } .chip { font-size:12px; background:#232838; color:var(--accent); padding:3px 8px; border-radius:6px; }
  details { margin-top:10px; font-size:12px; color:var(--muted); } summary { cursor:pointer; }
  .step { margin-top:8px; padding-left:10px; border-left:2px solid var(--line); white-space:pre-wrap; }
  form { display:flex; gap:10px; padding:18px max(24px, calc((100% - 760px)/2)) 26px; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; height:52px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  form button { background:var(--accent); color:#0b0d14; border:none; border-radius:12px; padding:0 20px; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; }
  .empty { margin:auto; text-align:center; color:var(--muted); } .empty b { display:block; font-size:22px; color:var(--text); margin-bottom:6px; }
</style>
</head>
<body>
<aside>
  <div><h1>Doc<span>Mind</span></h1><p class="sub">Importez vos documents, puis posez vos questions. L'agent cherche les passages utiles et cite ses sources.</p></div>
  <label class="drop" id="drop">📄 Glissez un PDF, TXT ou MD ici<br>ou cliquez pour choisir<input id="file" type="file" accept=".pdf,.txt,.md" hidden></label>
  <ul id="docs"></ul>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connexion…</span></div>
</aside>
<main>
  <div id="chat"><div class="empty" id="empty"><b>Posez une question sur vos documents</b>Exemple : « Quelles sont les conditions de remboursement ? »</div></div>
  <form id="form"><textarea id="q" placeholder="Votre question…" required></textarea><button id="send">Envoyer</button></form>
</main>
<script>
const $ = id => document.getElementById(id);
const history = [];

// Affiche un message dans la conversation
function add(cls, text) {
  $('empty')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + cls; div.textContent = text;
  $('chat').appendChild(div); $('chat').scrollTop = 1e9;
  return div;
}

async function refresh() {
  const docs = await fetch('/documents').then(r => r.json());
  $('docs').innerHTML = '';
  docs.forEach(d => {
    const li = document.createElement('li');
    li.innerHTML = `<span>📄 ${d.name} <small style="color:var(--muted)">· ${d.chunks}</small></span>`;
    const b = document.createElement('button'); b.textContent = '✕'; b.title = 'Retirer';
    b.onclick = async () => { await fetch('/documents/' + encodeURIComponent(d.name), {method:'DELETE'}); refresh(); };
    li.appendChild(b); $('docs').appendChild(li);
  });
  const h = await fetch('/health').then(r => r.json());
  $('dot').classList.toggle('up', h.llm === 'up');
  $('status').textContent = h.llm === 'up' ? `LLM connecté · ${h.chunks} passages indexés` : 'LLM indisponible (lancez Ollama)';
}

async function upload(file) {
  $('status').textContent = 'Indexation de ' + file.name + '…';
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch('/documents', {method:'POST', body:fd});
  if (!r.ok) alert((await r.json()).detail);
  refresh();
}

$('file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
['dragover','dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); $('drop').classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
}));

$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('form').onsubmit = async e => {
  e.preventDefault();
  const question = $('q').value.trim(); if (!question) return;
  add('user', question); $('q').value = ''; $('send').disabled = true;
  const bot = add('bot', 'Réflexion en cours…');
  try {
    const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, history})});
    const data = await r.json();
    bot.textContent = data.answer;
    if (data.sources.length) {
      const chips = document.createElement('div'); chips.className = 'chips';
      data.sources.forEach(s => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = s; chips.appendChild(c); });
      bot.appendChild(chips);
    }
    // Raisonnement de l'agent, repliable
    const det = document.createElement('details');
    det.innerHTML = `<summary>Raisonnement de l'agent (${data.steps.length} étapes)</summary>`;
    data.steps.forEach(s => {
      const d = document.createElement('div'); d.className = 'step';
      d.textContent = '💭 ' + s.thought + (s.action ? `\n🔧 ${s.action}(${s.input})` : '');
      det.appendChild(d);
    });
    bot.appendChild(det);
    history.push({role:'user', content:question}, {role:'assistant', content:data.answer});
  } catch { bot.textContent = 'Erreur : le serveur ne répond pas.'; }
  $('send').disabled = false;
};
refresh();
</script>
</body>
</html>
