[project]
name = "docmind"
version = "1.0.0"
description = "Agent RAG qui répond aux questions à partir de vos documents (FastAPI + Ollama)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # File(...) dans les paramètres est le style recommandé par FastAPI
